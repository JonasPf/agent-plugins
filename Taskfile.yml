version: '3'

# Every workflow in the repository. `task` on its own lists them.

tasks:
  default:
    desc: List the available tasks
    cmds: [task --list]
    silent: true

  fmt:
    desc: Format the Go sources in place
    cmds: [gofmt -w .]

  lint:
    desc: Report unformatted files and vet problems
    silent: true
    cmds:
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "gofmt needed:"; echo "$unformatted"; exit 1
        fi
      - go vet ./...

  test:
    desc: Run every test, under the race detector
    cmds:
      - go test -race $(go list ./... | grep -v /bundles/voice-over$)
      - task: test:voice-over

  # voice-over's tests run with the ffmpeg the bundle carries first on PATH,
  # so a filter or codec the bundle uses and its ffmpeg leaves out fails here.
  # The tests make their videos with the full ffmpeg already on PATH. The
  # bundle's is built once per version of ffmpeg/build.sh into .cache/ffmpeg,
  # or taken from VOICEOVER_FFMPEG_DIR where CI has built it.
  test:voice-over:
    desc: Run voice-over's tests with the ffmpeg it carries
    cmds:
      - |
        set -e
        full="$(command -v ffmpeg)"
        bin="${VOICEOVER_FFMPEG_DIR:-.cache/ffmpeg/$(cksum ffmpeg/build.sh | cut -d' ' -f1)-$(uname -s)-$(uname -m)}"
        [ -x "$bin/ffmpeg" ] || sh ffmpeg/build.sh "$bin"
        VOICEOVER_TEST_FFMPEG="$full" PATH="$(cd "$bin" && pwd):$PATH" go test -race ./bundles/voice-over/

  # The scripts a skill carries, on real video. Needs python3 and ffmpeg 8.
  test:skills:
    desc: Run the scripts the skills carry
    cmds: [python3 testenv/video_edit.py]

  check:
    desc: Everything that must pass before committing
    cmds:
      - task: lint
      - go build ./...
      - task: test
      - task: test:skills

  pack:skill:
    desc: Zip one skill, e.g. task pack:skill SKILL=researching VERSION=0.1.0
    requires: {vars: [SKILL, VERSION]}
    cmds: ['go run ./cmd/pack -skill {{.SKILL}} -version {{.VERSION}} -out dist']

  pack:
    desc: Build one bundle for every platform it runs on, e.g. task pack BUNDLE=clock
    requires: {vars: [BUNDLE]}
    cmds: ['go run ./cmd/pack -bundle {{.BUNDLE}} -out dist']
