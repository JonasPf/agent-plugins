# Publishes one bundle when a tag names it: <bundle>-v<version>, for example
# clock-v0.1.0. A tag skill-<name>-v<version> publishes one skill instead, as
# <name>-<version>.zip: the files of skills/<name>, SKILL.md at the top. The version in the tag has to be the one in the bundle's
# manifest, so a release cannot say one thing and hold another.
#
# Each platform's file is <bundle>-<version>-<os>-<arch>.mcpb, beside a
# sha256sums.txt that whoever pins a bundle checks it against.

name: release

on:
  push:
    tags: ['*-v*']

permissions:
  contents: write

jobs:
  # The ffmpeg voice-over carries, for each platform it is packed for: static,
  # in Alpine, on Linux; with the system's own libraries on macOS. Built once
  # per version of ffmpeg/build.sh, and only for voice-over.
  ffmpeg:
    if: startsWith(github.ref_name, 'voice-over-v')
    strategy:
      matrix:
        include:
          - {platform: linux-amd64, runner: ubuntu-latest}
          - {platform: linux-arm64, runner: ubuntu-24.04-arm}
          - {platform: darwin-arm64, runner: macos-14}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        id: cache
        with:
          path: ffmpeg-out
          key: ffmpeg-${{ matrix.platform }}-${{ hashFiles('ffmpeg/build.sh') }}

      - name: Build ffmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          case "${{ matrix.platform }}" in
            linux-*) docker run --rm -v "$PWD:/w" -w /w alpine:3.22 sh -c 'apk add --no-cache build-base nasm curl xz && sh ffmpeg/build.sh ffmpeg-out' ;;
            *) sh ffmpeg/build.sh ffmpeg-out ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.platform }}
          path: ffmpeg-out
          retention-days: 1

  # A bundle's tests run where check.yml runs them: Debian, the chromium the
  # agent's image has, and the ffmpeg a conversation installs. On the bare
  # runner voice-over's tests have no ffmpeg, and its page's browser test
  # would say it could not run rather than run.
  test:
    needs: ffmpeg
    # The ffmpeg job runs for voice-over alone; skipped, it holds nothing up.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    container:
      image: golang:1.25-bookworm
      options: --init
    env:
      PLUGINS_TEST_FULL: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install the browser, Nix and ffmpeg
        run: |
          apt-get update && apt-get install -y --no-install-recommends chromium xz-utils jq
          sh testenv/install-nix.sh
          sh testenv/install-ffmpeg.sh

      # The checkout is owned by a different uid than the one running git here.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/download-artifact@v4
        if: startsWith(github.ref_name, 'voice-over-v')
        with:
          name: ffmpeg-linux-amd64
          path: /opt/voiceover-ffmpeg

      # voice-over's tests run with the ffmpeg it carries first on PATH, and
      # make their videos with the full one (Taskfile test:voice-over).
      - name: Test the bundle
        run: |
          name="${GITHUB_REF_NAME%-v*}"
          case "$name" in
            skill-*) go test ./cmd/... ;;
            voice-over)
              go test ./internal/... ./cmd/...
              chmod +x /opt/voiceover-ffmpeg/ffmpeg
              VOICEOVER_TEST_FFMPEG="$(command -v ffmpeg)" PATH="/opt/voiceover-ffmpeg:$PATH" go test ./bundles/voice-over ;;
            *) go test ./internal/... ./cmd/... "./bundles/$name" ;;
          esac

  release:
    needs: [ffmpeg, test]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Read the tag
        id: tag
        run: |
          tag="${GITHUB_REF_NAME}"
          name="${tag%-v*}"
          version="${tag##*-v}"
          case "$name" in
            skill-*)
              echo "skill=${name#skill-}" >> "$GITHUB_OUTPUT" ;;
            *)
              have="$(jq -r .version "bundles/$name/manifest.json")"
              if [ "$have" != "$version" ]; then
                echo "the tag says $version and bundles/$name/manifest.json says $have" >&2
                exit 1
              fi
              echo "bundle=$name" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: steps.tag.outputs.bundle == 'voice-over'
        with:
          pattern: ffmpeg-*
          path: bins

      # Each platform's ffmpeg goes under bin/ in that platform's bundle, and
      # the source it was built from goes in the release beside them, which is
      # how its licence asks for it to be offered (bin/SOURCE.ffmpeg.txt).
      - name: Pack the bundle
        if: steps.tag.outputs.bundle
        run: |
          bin=""
          if [ "${{ steps.tag.outputs.bundle }}" = voice-over ]; then
            for d in bins/ffmpeg-*; do mv "$d" "bins/${d#bins/ffmpeg-}"; done
            chmod +x bins/*/ffmpeg
            mkdir -p dist && cp bins/linux-amd64/src/ffmpeg-*.tar.xz dist/
            bin="-bin bins"
          fi
          go run ./cmd/pack -bundle "${{ steps.tag.outputs.bundle }}" $bin -out dist
          cd dist && sha256sum * > sha256sums.txt && cat sha256sums.txt

      # A skill's scripts are tested by `task check` on the commit the tag is
      # on; here it is only packed.
      - name: Pack the skill
        if: steps.tag.outputs.skill
        run: |
          go run ./cmd/pack -skill "${{ steps.tag.outputs.skill }}" -version "${{ steps.tag.outputs.version }}" -out dist
          cd dist && sha256sum *.zip > sha256sums.txt && cat sha256sums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
